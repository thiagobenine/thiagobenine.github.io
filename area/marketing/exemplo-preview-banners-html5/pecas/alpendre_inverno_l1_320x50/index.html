<script>
(function(){
var ad=document.getElementById("ad");
function abre(){window.open(window.clickTag,"_blank");}
ad.addEventListener("click",abre);
ad.addEventListener("keydown",function(e){if(e.key==="Enter"){abre();}});
if(location.hash==="#fim"){ad.className="fim";return;}
var foi=false;
function vai(){if(!foi){foi=true;ad.classList.remove("pausa");}}
setTimeout(vai,1200);
if(document.fonts&&document.fonts.load){
Promise.all([document.fonts.load('400 20px AS'),document.fonts.load('italic 400 20px AS'),document.fonts.load('600 20px AG')]).then(vai,vai);
}else{vai();}
})();
